      --x-opacity: .6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --x-opacity: .3; }
      h1 { color: #e3e8f4; text-shadow: .045em .045em 0 rgba(255, 138, 122, .7); }
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: var(--x-opacity);
      background: var(--x-random) 0 0 / 192px 192px;
    }

    .scene {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    main {
      align-self: center;
      justify-self: center;
      text-align: center;
      padding: 56px 20px 0;
      max-width: 760px;
    }
    .name {
      font: 700 clamp(.95rem, 1.6vw, 1.1rem)/1 var(--sans);
      font-variation-settings: var(--mono);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink);
      margin: 0 0 4px;
    }
    .title {
      position: relative; display: inline-block;
      font-size: calc(clamp(3.5rem, 12vw, 8.5rem) * .92);
      padding-top: .55em; /* room for the cat */
      padding-bottom: .14em; /* room for the g's tail */
    }
    h1 {
      margin: 0;
      font-family: "Bagel Fat One", system-ui, sans-serif;
      font-weight: 400;
      font-size: 1em;
      line-height: .95;
      color: #56607e;
      text-shadow: .045em .045em 0 #ffc4b8;
    }

    /* Gray pixel cat, perched on the end of the title */
    .cat {
      position: absolute;
      right: -.05em; bottom: .8em;
      width: .72em;
      font-size: inherit;
      padding: 0; border: 0; background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cat svg { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .cat:focus-visible { outline: 3px dashed var(--ink); outline-offset: 6px; }
    .cat .tail-a { animation: tail-a 1.4s steps(1) infinite; }
    .cat .tail-b { animation: tail-b 1.4s steps(1) infinite; }
    @keyframes tail-a { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes tail-b { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    .cat .eyes-open { animation: eyes-open 4s steps(1) infinite; }
    .cat .eyes-shut { animation: eyes-shut 4s steps(1) infinite; }
    @keyframes eyes-open { 0%, 93% { opacity: 1; } 94%, 98% { opacity: 0; } 99% { opacity: 1; } }
    @keyframes eyes-shut { 0%, 93% { opacity: 0; } 94%, 98% { opacity: 1; } 99% { opacity: 0; } }
    .cat.happy .eyes-open { animation: none; opacity: 0; }
    .cat.happy .eyes-shut { animation: none; opacity: 1; }
    .cat:hover svg, .cat.happy svg { transform: translateY(-.04em); }

    .bubble {
      position: absolute;
      right: 30%; bottom: 100%;
      font: 700 .9rem/1 var(--sans);
      background: #fff; color: #3d2b5c;
      border: 2px solid #3d2b5c;
      border-radius: 14px;
      padding: 8px 12px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-2px) scale(.9);
      transition: opacity .15s, transform .15s;
      pointer-events: none;
    }
    .bubble.show { opacity: 1; transform: translateY(-10px); }

    .pop {
      position: fixed;
      width: 18px;
      color: var(--pink);
      pointer-events: none;
      animation: pop 1s steps(10) forwards;
      z-index: 10;
    }
    .pop svg { display: block; width: 100%; height: auto; }
    @keyframes pop { to { transform: translate(var(--dx), -100px); opacity: 0; } }

    .tagline {
      font: 500 clamp(1.05rem, 2.2vw, 1.25rem)/1.55 var(--sans);
      margin: 30px auto 0;
      max-width: 34ch;
    }
    .aside {
      font: 400 clamp(.95rem, 1.8vw, 1.05rem)/1.55 var(--sans);
      font-variation-settings: "CASL" 1, "slnt" -15;
      color: var(--ink-soft);
      margin: 10px auto 0;
      max-width: 44ch;
    }

    /* Highlighter links */
    .links {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 6px 0;
      margin-top: 30px;
    }
    .links a {
      --hl: var(--lav);
      color: var(--ink);
      font: 700 clamp(1.05rem, 2.2vw, 1.3rem)/1.2 var(--sans);
      font-variation-settings: var(--casual);
      text-decoration: none;
      padding: .1em .3em;
      background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 85% / 100% .38em;
      transition: background-size .2s ease;
    }
    .links a:nth-child(1) { --hl: var(--lav); }
    .links a:nth-child(3) { --hl: var(--blue); }
    .links a:nth-child(5) { --hl: var(--pink); }
    .links a:hover, .links a:focus-visible { background-size: 100% 100%; outline: none; }
    .links .sep { display: inline-block; width: 9px; margin: 0 6px; color: var(--pink); }
    .links .sep svg { display: block; width: 100%; height: auto; }
    @media (prefers-color-scheme: dark) {
      .links a:nth-child(5) { --hl: rgba(255, 138, 122, .45); }
    }

    footer {
      text-align: center;
      padding: 20px 20px 22px;
      font: 400 .78rem/1.6 var(--sans);
      font-variation-settings: var(--mono);
      letter-spacing: .04em;
      color: var(--ink-soft);
    }
    footer .dot { display: inline-block; width: 9px; margin: 0 .7em; color: var(--pink); }
    footer .dot svg { display: block; width: 100%; height: auto; }


    @media (prefers-reduced-motion: reduce) {
      .cat .tail-a, .cat .tail-b, .cat .eyes-open, .cat .eyes-shut { animation: none; }
      .cat .tail-b, .cat .eyes-shut { opacity: 0; }
      .links a, .bubble { transition: none; }
    }

    /* Optional extras (toggled by class on <body>) */
    .sticker {
      position: fixed;
      width: var(--w, 56px);
      transform: rotate(var(--r, 0deg));
      animation: bob 2.4s steps(2) infinite;
      animation-delay: var(--d, 0s);
      pointer-events: none;
    }
    .sticker svg { display: block; width: 100%; height: auto; }
    @keyframes bob { 50% { translate: 0 -4px; } }
    @media (max-width: 640px) { .sticker { --w: 34px !important; } }

    @media (prefers-reduced-motion: reduce) { .sticker { animation: none; } }
  </style>
</head>

  <script>
    const cat = document.querySelector(".cat");
    const bubble = cat.querySelector(".bubble");
    const lines = ["mrrp?", "pet me", "meow.", "clever girl", "feed me", "♥"];
    let i = 0, timer;

    cat.addEventListener("click", () => {
      bubble.textContent = lines[i++ % lines.length];
      bubble.classList.add("show");
      cat.classList.add("happy");
      clearTimeout(timer);
      timer = setTimeout(() => { bubble.classList.remove("show"); cat.classList.remove("happy"); }, 1400);

      const r = cat.getBoundingClientRect();
      for (let n = 0; n < 5; n++) {
        const h = document.createElement("span");
        h.className = "pop";
        h.innerHTML = '<svg viewBox="0 0 7 6"><use href="#heart"/></svg>';
        h.style.left = (r.left + r.width * (.2 + Math.random() * .5)) + "px";
        h.style.top = (r.top + r.height * .2) + "px";
        h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
        h.style.animationDelay = (n * 90) + "ms";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1600);
      }
    });

  </script>
