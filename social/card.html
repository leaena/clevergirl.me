<!doctype html>
<!-- Source for /og-image.png (the link-preview card). Rebuild with headless Chrome:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=8000 --window-size=1200,630 --screenshot=og-image.png social/card.html
     Slack's in-chat preview crops to the centre square (x 285-915), so the important bits live there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Recursive:wght,MONO@400..800,0..1&display=block" rel="stylesheet">
<style>
  :root { --shake: #ff9ec4; --shake-deep: #ff6fa3; --neon: #ffb3d6; --muted: #a9a3c4; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: grid; place-items: center;
    background:
      radial-gradient(700px 360px at 50% 40%, rgba(255, 110, 170, .2), transparent 70%),
      linear-gradient(#13122a, #1d1b3d);
    font-family: "Recursive", monospace;
    font-variation-settings: "MONO" 1;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .09; mix-blend-mode: screen; image-rendering: pixelated; }
  body::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }
  main { position: relative; z-index: 1; text-align: center; transform: translateY(-4px); }
  h1 {
    margin: 0;
    font: 400 150px/1 "Yellowtail", cursive;
    color: #fff0f7;
    text-shadow: 0 0 5px #fff, 0 0 16px var(--neon), 0 0 36px var(--shake), 0 0 80px var(--shake-deep), 0 0 140px rgba(255, 111, 163, .6);
    transform: rotate(-4deg);
  }
  .sign {
    display: inline-block; margin-top: 22px;
    font-weight: 700; font-size: 30px; letter-spacing: .3em;
    color: #c8f5e6; text-shadow: 0 0 10px rgba(130, 240, 200, .85);
    border: 3px solid rgba(160, 245, 215, .75);
    box-shadow: 0 0 16px rgba(130, 240, 200, .4), inset 0 0 16px rgba(130, 240, 200, .3);
    padding: 12px 10px 12px 20px; border-radius: 6px;
  }
  .url { margin-top: 22px; font-weight: 700; font-size: 24px; letter-spacing: .12em; color: var(--muted); }
  .vcr {
    position: absolute; z-index: 1; font-weight: 700; font-size: 20px; letter-spacing: .12em; color: var(--muted);
  }
  .live { color: var(--shake); display: inline-flex; align-items: center; gap: 14px; }
  .live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
</style>
</head>
<body>
  <canvas id="static"></canvas>
  <div class="vcr live" style="top:40px; left:48px">OPEN LATE</div>
  <div class="vcr" style="top:40px; right:48px">3:33 AM · OREGON</div>
  <div class="vcr" style="bottom:40px; left:48px">SP · CH 03</div>
  <div class="vcr" style="bottom:40px; right:48px">▶ PLAY</div>
  <main>
    <h1>clever girl</h1>
    <div class="sign">LINDSEY SMITH</div>
    <div class="url">clevergirl.me</div>
  </main>
  <script>
    // One frame of the site's warm pink static
    const cv = document.getElementById("static"), cx = cv.getContext("2d");
    cv.width = 400; cv.height = 210;
    const img = cx.createImageData(cv.width, cv.height), d = img.data;
    let seed = 33;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < d.length; i += 4) { const v = rand() * 255; d[i] = v; d[i + 1] = v * .85; d[i + 2] = v * .92; d[i + 3] = 255; }
    cx.putImageData(img, 0, 0);
  </script>
</body>
</html>
